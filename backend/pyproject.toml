[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "well-log-viewer-backend"
version = "0.1.0"
description = "MultiViewer Well Log Viewer — Backend (WL-BUILD-001 scaffold)"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.111.0",
    "pydantic>=2.0.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "dlisio>=1.0.4,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

# lasio deferred — will be added when LAS parsing is wired in WL-BUILD-002+.
# Do not add lasio until the LAS import sprint with explicit import tests.

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "runtime*", "tests*", "*.egg-info*"]
